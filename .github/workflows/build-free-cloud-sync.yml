# .github/workflows/build-free-cloud-sync.yml
#
# 解锁 CLOUD_SYNC_REQUIRES_PREMIUM（支持 WebDAV 等同步方式），
# 编译 Windows exe + Android 自动签名 APK，并自动发布到 Release & Artifacts。
#
# 用法：Actions → Build free cloud-sync → Run workflow

name: Build free cloud-sync

'on':
  workflow_dispatch:
    inputs:
      release:
        description: "Windows: Release 优化构建（无控制台黑框）"
        type: boolean
        default: true
      build_windows:
        description: "编译 Windows exe"
        type: boolean
        default: true
      build_android:
        description: "同时编译 Android APK（自动生成证书签名）"
        type: boolean
        default: true
      publish_release:
        description: "同时创建/更新 GitHub Release（便于手机与电脑直接下载）"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_DIR: apps/readest-app

jobs:
  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/readest-app/src-tauri/target
            target
          key: free-cloud-cargo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-cargo-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          sed -i 's/export const TTS_CACHE_REQUIRES_PREMIUM = true;/export const TTS_CACHE_REQUIRES_PREMIUM = false;/' "$FILE" || true
          sed -i 's/export const ABS_OFFLINE_REQUIRES_PREMIUM = true;/export const ABS_OFFLINE_REQUIRES_PREMIUM = false;/' "$FILE" || true
          sed -i 's/export const NEARBY_PAIRING_REQUIRES_PREMIUM = true;/export const NEARBY_PAIRING_REQUIRES_PREMIUM = false;/' "$FILE" || true
          sed -i 's/export const isCustomTranslatorAllowed = .*/export const isCustomTranslatorAllowed = (_token: string | null | undefined): boolean => true;/' "$FILE" || true
          sed -i 's/export const isCustomTTSAllowed = .*/export const isCustomTTSAllowed = (_token?: string | null | undefined): boolean => true;/' "$FILE" || true
          grep -E "REQUIRES_PREMIUM" "$FILE"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          DBUS_ID: com.bilingify.readest
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          pnpm exec next build

      - name: Build Tauri
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          DBUS_ID: com.bilingify.readest
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' > .ci-tauri-override.json

          if [ "${{ inputs.release }}" = "true" ]; then
            FLAG=""
          else
            FLAG="--debug"
          fi

          pnpm exec tauri build $FLAG --no-bundle --config .ci-tauri-override.json

          ROOT="${GITHUB_WORKSPACE}"
          EXE=""
          for candidate in \
            "$ROOT/target/release/readest.exe" \
            "$ROOT/target/x86_64-pc-windows-msvc/release/readest.exe" \
            "$ROOT/apps/readest-app/src-tauri/target/release/readest.exe" \
            "$ROOT/apps/readest-app/src-tauri/target/x86_64-pc-windows-msvc/release/readest.exe" \
            "$ROOT/target/debug/readest.exe" \
            "$ROOT/apps/readest-app/src-tauri/target/debug/readest.exe"
          do
            if [ -f "$candidate" ]; then
              EXE="$candidate"
              break
            fi
          done

          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            EXE=$(find "$ROOT" -name 'readest.exe' -type f 2>/dev/null | head -1 || true)
          fi

          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "::error::readest.exe not found"
            find "$ROOT" -name '*.exe' 2>/dev/null | head -50 || true
            exit 1
          fi

          echo "Found readest.exe at: $EXE ($(du -h "$EXE" | cut -f1))"
          mkdir -p "$ROOT/dist"
          cp "$EXE" "$ROOT/dist/readest.exe"
          ls -la "$ROOT/dist/"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-windows
          path: dist/readest.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK & platforms
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK_DIR="${ANDROID_HOME}/ndk/28.2.13676358"
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          test -d "$NDK_DIR"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/readest-app/src-tauri/target
            target
          key: free-cloud-and-cargo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/readest-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            free-cloud-and-cargo-${{ runner.os }}-

      - name: Disable cloud-sync premium gate
        run: |
          set -euo pipefail
          FILE="apps/readest-app/src/utils/access.ts"
          sed -i 's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' "$FILE"
          sed -i 's/export const TTS_CACHE_REQUIRES_PREMIUM = true;/export const TTS_CACHE_REQUIRES_PREMIUM = false;/' "$FILE" || true
          sed -i 's/export const ABS_OFFLINE_REQUIRES_PREMIUM = true;/export const ABS_OFFLINE_REQUIRES_PREMIUM = false;/' "$FILE" || true
          sed -i 's/export const NEARBY_PAIRING_REQUIRES_PREMIUM = true;/export const NEARBY_PAIRING_REQUIRES_PREMIUM = false;/' "$FILE" || true
          sed -i 's/export const isCustomTranslatorAllowed = .*/export const isCustomTranslatorAllowed = (_token: string | null | undefined): boolean => true;/' "$FILE" || true
          sed -i 's/export const isCustomTTSAllowed = .*/export const isCustomTTSAllowed = (_token?: string | null | undefined): boolean => true;/' "$FILE" || true
          grep -E "REQUIRES_PREMIUM" "$FILE"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          DBUS_ID: com.bilingify.readest
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          pnpm exec next build

      - name: Init Android project (gen/android)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          # Backup tracked gen/android files before init
          mkdir -p /tmp/gen-backup
          cp -r src-tauri/gen/android /tmp/gen-backup/

          rm -rf src-tauri/gen/android
          pnpm exec tauri android init
          pnpm exec tauri icon ../../data/icons/readest-book.png || true

          # Restore tracked files (build.gradle.kts with signingConfigs, AndroidManifest with storage permissions)
          cp -r /tmp/gen-backup/android/* src-tauri/gen/android/
          git checkout src-tauri/gen/android || true

          echo "Checking build.gradle.kts for signingConfigs..."
          grep "signingConfigs" src-tauri/gen/android/app/build.gradle.kts

      - name: Generate and configure Release Signing Key
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE="$KEYSTORE_DIR/readest-release.jks"

          echo "Generating standard Release Keystore (2048-bit RSA, 10000 days)..."
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias readest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass readest123 \
            -keypass readest123 \
            -dname "CN=Readest, OU=Readest, O=Readest, C=US"

          printf 'keyAlias=readest\npassword=readest123\nstoreFile=%s\n' "$KEYSTORE" > src-tauri/gen/android/keystore.properties
          cp src-tauri/gen/android/keystore.properties src-tauri/gen/android/app/keystore.properties || true
          echo "Configured src-tauri/gen/android/keystore.properties successfully."

      - name: Build Android APK (release, auto-signed)
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          pnpm exec tauri android build --apk -t aarch64

          ROOT="${GITHUB_WORKSPACE}"
          mkdir -p "$ROOT/dist"
          APK=$(find "$ROOT" -path '*release*' -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find "$ROOT" -name '*.apk' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found"
            find "$ROOT" -name '*.apk' 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Using APK: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" "$ROOT/dist/Readest-free-cloud-sync.apk"
          ls -la "$ROOT/dist/"

      - name: Verify APK Signature
        run: |
          set -euo pipefail
          APK="dist/Readest-free-cloud-sync.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature using $APKSIGNER..."
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "apksigner not found in build-tools; skipping check"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-free-cloud-sync-android
          path: dist/Readest-free-cloud-sync.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release to GitHub (Optional)
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [build-windows, build-android]
    if: ${{ always() && inputs.publish_release && (needs.build-windows.result == 'success' || needs.build-android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: readest-free-cloud-sync-windows
          path: release-assets

      - name: Download Android artifact
        if: ${{ needs.build-android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: readest-free-cloud-sync-android
          path: release-assets

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/readest-app/package.json').version")
          TAG="v${VERSION}-free"
          TITLE="Readest v${VERSION} (Free Cloud Sync / WebDAV)"
          BODY="### Readest v${VERSION} 解锁版
          - 解锁了 WebDAV 等第三方云同步付费门限制（第三方云同步不受会员计划限制）
          - 解锁了自定义翻译（Custom Translator / OpenAI / DeepL）
          - 解锁了自定义语音（Custom TTS / OpenAI 兼容端点）
          - 解锁了 TTS 离线音频缓存与 Audiobookshelf 离线下载
          - 基于官方上游最新代码编译 (v${VERSION})
          
          #### 文件下载：
          - Windows 绿色便携版：\`readest.exe\`
          - Android 安装包：\`Readest-free-cloud-sync.apk\` (针对 aarch64 优化，已签名，支持全部文件访问权限)"

          echo "Publishing release with tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "$BODY" --prerelease=false

          for f in release-assets/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "$TAG" "$f" --clobber
            fi
          done
